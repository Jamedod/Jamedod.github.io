<svg viewBox="0 0 560 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="edTitle edDesc">
  <title id="edTitle">Illustration of a code editor window</title>
  <desc id="edDesc">A stylised code editor window with a file sidebar and lines of syntax-highlighted code representing a profile object.</desc>
  <rect width="560" height="380" rx="12" fill="#181825"/>
  <!-- title bar -->
  <rect width="560" height="34" rx="12" fill="#11111b"/>
  <circle cx="22" cy="17" r="6" fill="#f38ba8"/>
  <circle cx="44" cy="17" r="6" fill="#fab387"/>
  <circle cx="66" cy="17" r="6" fill="#a6e3a1"/>
  <text x="280" y="22" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#6c7086" text-anchor="middle">profile.js</text>
  <!-- sidebar -->
  <rect x="0" y="34" width="120" height="346" fill="#11111b"/>
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="11" fill="#6c7086">
    <text x="16" y="60">index.html</text>
    <text x="16" y="80">about.html</text>
    <text x="16" y="100" fill="#a6e3a1">profile.js</text>
    <text x="16" y="120">contact.html</text>
  </g>
  <!-- code lines -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="14">
    <text x="140" y="70" fill="#89b4fa">const</text>
    <text x="195" y="70" fill="#cdd6f4">profile = {</text>

    <text x="160" y="95" fill="#f38ba8">name:</text>
    <text x="215" y="95" fill="#a6e3a1">"Htoo Tay Zar Aung"</text>
    <text x="410" y="95" fill="#cdd6f4">,</text>

    <text x="160" y="120" fill="#f38ba8">role:</text>
    <text x="212" y="120" fill="#a6e3a1">"CPA Student"</text>
    <text x="340" y="120" fill="#cdd6f4">,</text>

    <text x="160" y="145" fill="#f38ba8">based:</text>
    <text x="220" y="145" fill="#a6e3a1">"London, ON"</text>
    <text x="340" y="145" fill="#cdd6f4">,</text>

    <text x="160" y="170" fill="#f38ba8">skills:</text>
    <text x="228" y="170" fill="#cdd6f4">[</text>
    <text x="238" y="170" fill="#a6e3a1">"Java"</text>
    <text x="290" y="170" fill="#cdd6f4">,</text>
    <text x="300" y="170" fill="#a6e3a1">"Python"</text>
    <text x="365" y="170" fill="#cdd6f4">,</text>
    <text x="375" y="170" fill="#a6e3a1">"SQL"</text>
    <text x="415" y="170" fill="#cdd6f4">],</text>

    <text x="160" y="195" fill="#f38ba8">available:</text>
    <text x="250" y="195" fill="#fab387">true</text>

    <text x="140" y="220" fill="#cdd6f4">};</text>
  </g>
  <rect x="140" y="230" width="9" height="16" fill="#a6e3a1">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
